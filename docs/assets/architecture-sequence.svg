<!--
  Zero-Trust Edge Enclave — architecture diagram
  Generated 2026-09-18. Purpose: README and hackathon submission material.
  Sources of truth: audit-boundary.js (state allowlist), task-operations.js (resumable reason
  codes), file-routing.js (five-field projection), private-mapping.js (group codes).
  This depicts the implementation as built; it does not show mechanisms that do not exist.
-->
<svg width="100%" viewBox="0 0 680 778" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Delivery sequence</title>
  <desc>Five lifelines: sender, backend, key vault, adviser, phone. Sixteen messages from browser-side encryption through double confirmation, the five-field projection to the adviser, gate re-verification, recipient authentication, one-use key ticket, on-device decryption, receipt reporting and sender polling. The adviser lifeline ends after step five.</desc>
  <style>
    text { font-family: -apple-system, "Helvetica Neue", Inter, system-ui, sans-serif; }
    .ts { font-size: 12px; fill: #5f5e5a; }
    .th { font-size: 14px; font-weight: 500; fill: #1a1a1a; }
    .box { fill: #ffffff; stroke: #888880; stroke-width: 0.5; }
    .arr { stroke: #5f5e5a; stroke-width: 1.5; fill: none; }
    .leader { stroke: #b4b2a9; stroke-width: 0.5; stroke-dasharray: 4 3; fill: none; }
    .c-teal   > rect { fill: #E1F5EE; stroke: #0F6E56; } .c-teal   > text { fill: #085041; }
    .c-coral  > rect { fill: #FAECE7; stroke: #993C1D; } .c-coral  > text { fill: #712B13; }
    .c-purple > rect { fill: #EEEDFE; stroke: #534AB7; } .c-purple > text { fill: #3C3489; }
    .c-gray   > rect { fill: #F1EFE8; stroke: #5F5E5A; } .c-gray   > text { fill: #444441; }
    .c-amber  > rect { fill: #FAEEDA; stroke: #854F0B; } .c-amber  > text { fill: #633806; }
    .c-red    > rect { fill: #FCEBEB; stroke: #A32D2D; } .c-red    > text { fill: #791F1F; }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

  <g class="c-coral"><rect x="40" y="40" width="112" height="44" rx="8" stroke-width="0.5"/><text class="th" x="96" y="62" text-anchor="middle" dominant-baseline="central">Sender</text></g>
  <g class="c-teal"><rect x="176" y="40" width="112" height="44" rx="8" stroke-width="0.5"/><text class="th" x="232" y="62" text-anchor="middle" dominant-baseline="central">Backend</text></g>
  <g class="c-teal"><rect x="312" y="40" width="112" height="44" rx="8" stroke-width="0.5"/><text class="th" x="368" y="62" text-anchor="middle" dominant-baseline="central">Key vault</text></g>
  <g class="c-purple"><rect x="448" y="40" width="112" height="44" rx="8" stroke-width="0.5"/><text class="th" x="504" y="62" text-anchor="middle" dominant-baseline="central">Adviser</text></g>
  <g class="c-coral"><rect x="584" y="40" width="56" height="44" rx="8" stroke-width="0.5"/><text class="th" x="612" y="62" text-anchor="middle" dominant-baseline="central">Phone</text></g>

  <line x1="96" y1="84" x2="96" y2="680" class="leader"/><line x1="232" y1="84" x2="232" y2="680" class="leader"/>
  <line x1="368" y1="84" x2="368" y2="680" class="leader"/><line x1="504" y1="84" x2="504" y2="318" class="leader"/>
  <line x1="612" y1="84" x2="612" y2="680" class="leader"/>

  <line x1="96" y1="112" x2="232" y2="112" class="arr" marker-end="url(#a)"/>
  <text class="ts" x="164" y="104" text-anchor="middle">1. First confirmation</text>
  <line x1="232" y1="146" x2="368" y2="146" class="arr" marker-end="url(#a)"/>
  <text class="ts" x="300" y="138" text-anchor="middle">2. Wrap document key</text>
  <line x1="96" y1="180" x2="232" y2="180" class="arr" marker-end="url(#a)"/>
  <text class="ts" x="164" y="172" text-anchor="middle">3. Second confirmation</text>
  <line x1="232" y1="248" x2="504" y2="248" class="arr" marker-end="url(#a)"/>
  <text class="ts" x="368" y="240" text-anchor="middle">4. taskAlias · snapshotVersion · channels · state · attempts</text>
  <line x1="504" y1="290" x2="232" y2="290" class="arr" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text class="ts" x="368" y="282" text-anchor="middle">5. ROUTE or PAUSE (advice)</text>
  <line x1="232" y1="376" x2="612" y2="376" class="arr" marker-end="url(#a)"/>
  <text class="ts" x="422" y="368" text-anchor="middle">7. Notice prepared</text>
  <line x1="612" y1="410" x2="232" y2="410" class="arr" marker-end="url(#a)"/>
  <text class="ts" x="422" y="402" text-anchor="middle">8. Open over https, authenticate</text>
  <line x1="232" y1="444" x2="612" y2="444" class="arr" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text class="ts" x="422" y="436" text-anchor="middle">9. Ciphertext, no key</text>
  <line x1="612" y1="478" x2="232" y2="478" class="arr" marker-end="url(#a)"/>
  <text class="ts" x="422" y="470" text-anchor="middle">10. Exchange one-use ticket</text>
  <line x1="232" y1="512" x2="368" y2="512" class="arr" marker-end="url(#a)"/>
  <text class="ts" x="300" y="504" text-anchor="middle">11. Unwrap</text>
  <line x1="368" y1="546" x2="612" y2="546" class="arr" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text class="ts" x="490" y="538" text-anchor="middle">12. Key: five minutes, single use</text>
  <line x1="612" y1="614" x2="232" y2="614" class="arr" marker-end="url(#a)"/>
  <text class="ts" x="422" y="606" text-anchor="middle">14. Report download / verified / acknowledged</text>
  <line x1="96" y1="648" x2="232" y2="648" class="arr" marker-end="url(#a)"/>
  <text class="ts" x="164" y="640" text-anchor="middle">15. Poll every second</text>
  <line x1="232" y1="674" x2="96" y2="674" class="arr" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text class="ts" x="164" y="666" text-anchor="middle">16. Who received it</text>

  <g class="c-gray"><rect x="176" y="304" width="256" height="44" rx="8" stroke-width="0.5"/>
    <text class="ts" x="304" y="318" text-anchor="middle" dominant-baseline="central">6. Re-verify authority, then resolve</text>
    <text class="ts" x="304" y="334" text-anchor="middle" dominant-baseline="central">recipients from the snapshot</text></g>
  <g class="c-gray"><rect x="500" y="550" width="140" height="34" rx="8" stroke-width="0.5"/>
    <text class="ts" x="570" y="567" text-anchor="middle" dominant-baseline="central">13. Decrypt on device</text></g>

  <g class="c-purple"><rect x="40" y="702" width="600" height="56" rx="8" stroke-width="0.5"/>
    <text class="ts" x="340" y="722" text-anchor="middle" dominant-baseline="central">Never reaches the adviser: the document, real identities, addresses, keys,</text>
    <text class="ts" x="340" y="740" text-anchor="middle" dominant-baseline="central">how many recipients, or which departments. Its lifeline ends after step 5.</text></g>
</svg>
