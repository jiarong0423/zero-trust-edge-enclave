<!--
  Zero-Trust Edge Enclave — architecture diagram
  Generated 2026-09-18, revised 2026-09-19 for the delivery follow-up exchange and 2026-09-25 for
  answer validation, adviser retries, the evidence trail and the evidence chain.
  Purpose: README and hackathon submission material.
  Sources of truth: audit-boundary.js (state allowlist), task-operations.js (resumable reason
  codes), file-routing.js and delivery-followup.js (the two five-field projections),
  file-worker.js (both worker passes), private-mapping.js (group codes), task-evidence.js (evidence chain), server.js (whoami, evidence route).
  This depicts the implementation as built; it does not show mechanisms that do not exist.
-->
<svg width="100%" viewBox="0 0 680 1000" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Delivery sequence</title>
  <desc>Five lifelines: sender, backend, key vault, adviser, phone. Every party signs in with its own token; a verified identity is not access. Twenty-one messages from double confirmation through the five-field projection to the adviser, answer validation with bounded retries, gate re-verification, recipient authentication with refusal for anyone outside the snapshot, one-use key ticket, on-device decryption, receipt reporting, follow-up only while someone has not collected, sender polling, and the evidence chain the sender can open. Each adviser call is recorded with what it was given and what came back.</desc>
  <style>
    text { font-family: -apple-system, "Helvetica Neue", Inter, system-ui, sans-serif; }
    .ts { font-size: 12px; fill: #5f5e5a; }
    .th { font-size: 14px; font-weight: 500; fill: #1a1a1a; }
    .box { fill: #ffffff; stroke: #888880; stroke-width: 0.5; }
    .arr { stroke: #5f5e5a; stroke-width: 1.5; fill: none; }
    .leader { stroke: #b4b2a9; stroke-width: 0.5; stroke-dasharray: 4 3; fill: none; }
    .c-teal   > rect { fill: #E1F5EE; stroke: #0F6E56; } .c-teal   > text { fill: #085041; }
    .c-coral  > rect { fill: #FAECE7; stroke: #993C1D; } .c-coral  > text { fill: #712B13; }
    .c-purple > rect { fill: #EEEDFE; stroke: #534AB7; } .c-purple > text { fill: #3C3489; }
    .c-gray   > rect { fill: #F1EFE8; stroke: #5F5E5A; } .c-gray   > text { fill: #444441; }
    .c-amber  > rect { fill: #FAEEDA; stroke: #854F0B; } .c-amber  > text { fill: #633806; }
    .c-red    > rect { fill: #FCEBEB; stroke: #A32D2D; } .c-red    > text { fill: #791F1F; }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

  <g class="c-coral"><rect x="40" y="40" width="112" height="44" rx="8" stroke-width="0.5"/><text class="th" x="96" y="62" text-anchor="middle" dominant-baseline="central">Sender</text></g>
  <g class="c-teal"><rect x="176" y="40" width="112" height="44" rx="8" stroke-width="0.5"/><text class="th" x="232" y="62" text-anchor="middle" dominant-baseline="central">Backend</text></g>
  <g class="c-teal"><rect x="312" y="40" width="112" height="44" rx="8" stroke-width="0.5"/><text class="th" x="368" y="62" text-anchor="middle" dominant-baseline="central">Key vault</text></g>
  <g class="c-purple"><rect x="448" y="40" width="112" height="44" rx="8" stroke-width="0.5"/><text class="th" x="504" y="62" text-anchor="middle" dominant-baseline="central">Adviser</text></g>
  <g class="c-coral"><rect x="584" y="40" width="56" height="44" rx="8" stroke-width="0.5"/><text class="th" x="612" y="62" text-anchor="middle" dominant-baseline="central">Phone</text></g>

  <line x1="96" y1="84" x2="96" y2="876" class="leader"/><line x1="232" y1="84" x2="232" y2="876" class="leader"/>
  <line x1="368" y1="84" x2="368" y2="876" class="leader"/><line x1="504" y1="84" x2="504" y2="876" class="leader"/>
  <line x1="612" y1="84" x2="612" y2="876" class="leader"/>

  <g class="c-gray"><rect x="40" y="96" width="600" height="28" rx="8" stroke-width="0.5"/>
    <text class="ts" x="340" y="110" text-anchor="middle" dominant-baseline="central">Every party signs in with its own token. A verified identity is not access to a delivery.</text></g>
  <line x1="96" y1="154" x2="232" y2="154" class="arr" marker-end="url(#a)"/>
  <text class="ts" x="164" y="146" text-anchor="middle">1. First confirmation</text>
  <line x1="232" y1="188" x2="368" y2="188" class="arr" marker-end="url(#a)"/>
  <text class="ts" x="300" y="180" text-anchor="middle">2. Wrap document key</text>
  <line x1="96" y1="222" x2="232" y2="222" class="arr" marker-end="url(#a)"/>
  <text class="ts" x="164" y="214" text-anchor="middle">3. Second confirmation</text>
  <line x1="232" y1="270" x2="504" y2="270" class="arr" marker-end="url(#a)"/>
  <text class="ts" x="368" y="262" text-anchor="middle">4. taskAlias · snapshotVersion · channels · state · attempts</text>
  <line x1="504" y1="308" x2="232" y2="308" class="arr" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text class="ts" x="368" y="300" text-anchor="middle">5. ROUTE or PAUSE (advice)</text>
  <g class="c-gray"><rect x="150" y="320" width="336" height="80" rx="8" stroke-width="0.5"/>
    <text class="ts" x="318" y="334" text-anchor="middle" dominant-baseline="central">6. Validate the answer; a refused answer pauses the job.</text>
    <text class="ts" x="318" y="351" text-anchor="middle" dominant-baseline="central">First check unanswered: ask again, 3 × 30 s, then pause.</text>
    <text class="ts" x="318" y="368" text-anchor="middle" dominant-baseline="central">Record what was sent and what came back.</text>
    <text class="ts" x="318" y="385" text-anchor="middle" dominant-baseline="central">Re-verify authority, then resolve recipients.</text>
  </g>
  <line x1="232" y1="424" x2="612" y2="424" class="arr" marker-end="url(#a)"/>
  <text class="ts" x="422" y="416" text-anchor="middle">7. Notice prepared</text>
  <line x1="612" y1="458" x2="232" y2="458" class="arr" marker-end="url(#a)"/>
  <text class="ts" x="422" y="450" text-anchor="middle">8. Authenticate; not on the snapshot: refused, logged</text>
  <line x1="232" y1="492" x2="612" y2="492" class="arr" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text class="ts" x="422" y="484" text-anchor="middle">9. Ciphertext, no key</text>
  <line x1="612" y1="526" x2="232" y2="526" class="arr" marker-end="url(#a)"/>
  <text class="ts" x="422" y="518" text-anchor="middle">10. Exchange one-use ticket</text>
  <line x1="232" y1="560" x2="368" y2="560" class="arr" marker-end="url(#a)"/>
  <text class="ts" x="300" y="552" text-anchor="middle">11. Unwrap</text>
  <line x1="368" y1="594" x2="612" y2="594" class="arr" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text class="ts" x="490" y="586" text-anchor="middle">12. Key: five minutes, single use</text>
  <g class="c-gray"><rect x="500" y="598" width="140" height="34" rx="8" stroke-width="0.5"/>
    <text class="ts" x="570" y="615" text-anchor="middle" dominant-baseline="central">13. Decrypt on device</text></g>
  <line x1="612" y1="662" x2="232" y2="662" class="arr" marker-end="url(#a)"/>
  <text class="ts" x="422" y="654" text-anchor="middle">14. Report download / verified / acknowledged</text>
  <line x1="232" y1="698" x2="504" y2="698" class="arr" marker-end="url(#a)"/>
  <text class="ts" x="368" y="690" text-anchor="middle">15. Someone has not collected: timeCode · nudgeCount · pickupCode</text>
  <line x1="504" y1="728" x2="232" y2="728" class="arr" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text class="ts" x="368" y="720" text-anchor="middle">16. WAIT, REMIND or ESCALATE</text>
  <line x1="232" y1="760" x2="612" y2="760" class="arr" marker-end="url(#a)"/>
  <text class="ts" x="422" y="752" text-anchor="middle">17. Reminder, only to those who have not collected</text>
  <line x1="96" y1="792" x2="232" y2="792" class="arr" marker-end="url(#a)"/>
  <text class="ts" x="164" y="784" text-anchor="middle">18. Poll every second</text>
  <line x1="232" y1="818" x2="96" y2="818" class="arr" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text class="ts" x="164" y="810" text-anchor="middle">19. Who received it</text>
  <line x1="96" y1="846" x2="232" y2="846" class="arr" marker-end="url(#a)"/>
  <text class="ts" x="164" y="838" text-anchor="middle">20. Open evidence</text>
  <line x1="232" y1="870" x2="96" y2="870" class="arr" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text class="ts" x="164" y="862" text-anchor="middle">21. Evidence chain</text>

  <g class="c-purple"><rect x="40" y="894" width="600" height="86" rx="8" stroke-width="0.5"/>
    <text class="ts" x="340" y="912" text-anchor="middle" dominant-baseline="central">Never reaches either adviser: the document, real identities, addresses, keys,</text>
    <text class="ts" x="340" y="930" text-anchor="middle" dominant-baseline="central">how many recipients, how many collected, or which departments.</text>
    <text class="ts" x="340" y="948" text-anchor="middle" dominant-baseline="central">Steps 20–21: only the sender; views audited, at most once a minute per task. It shows what each adviser</text>
    <text class="ts" x="340" y="966" text-anchor="middle" dominant-baseline="central">call was given, what came back, and whom fixed code actually reached.</text>
  </g>
</svg>
