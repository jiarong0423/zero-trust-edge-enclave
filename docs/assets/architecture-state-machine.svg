<!--
  Zero-Trust Edge Enclave — architecture diagram
  Generated 2026-09-18. Purpose: README and hackathon submission material.
  Sources of truth: audit-boundary.js (state allowlist), task-operations.js (resumable reason
  codes), file-routing.js (five-field projection), private-mapping.js (group codes).
  This depicts the implementation as built; it does not show mechanisms that do not exist.
-->
<svg width="100%" viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Task state machine</title>
  <desc>Spine: DRAFT to LOCKED on first confirmation, to APPROVED on second confirmation, then PENDING_CHECK once a delivery job exists. Side exits: INVALIDATED on revision, REVOKED on revocation. PENDING_CHECK branches to DRY_RUN_PREPARED, OUTCOME_UNKNOWN, RETRY_WAIT or PAUSED. PAUSED returns to PENDING_CHECK only for five resumable reason codes. All ten states come from the audit allowlist.</desc>
  <style>
    text { font-family: -apple-system, "Helvetica Neue", Inter, system-ui, sans-serif; }
    .ts { font-size: 12px; fill: #5f5e5a; }
    .th { font-size: 14px; font-weight: 500; fill: #1a1a1a; }
    .box { fill: #ffffff; stroke: #888880; stroke-width: 0.5; }
    .arr { stroke: #5f5e5a; stroke-width: 1.5; fill: none; }
    .leader { stroke: #b4b2a9; stroke-width: 0.5; stroke-dasharray: 4 3; fill: none; }
    .c-teal   > rect { fill: #E1F5EE; stroke: #0F6E56; } .c-teal   > text { fill: #085041; }
    .c-coral  > rect { fill: #FAECE7; stroke: #993C1D; } .c-coral  > text { fill: #712B13; }
    .c-purple > rect { fill: #EEEDFE; stroke: #534AB7; } .c-purple > text { fill: #3C3489; }
    .c-gray   > rect { fill: #F1EFE8; stroke: #5F5E5A; } .c-gray   > text { fill: #444441; }
    .c-amber  > rect { fill: #FAEEDA; stroke: #854F0B; } .c-amber  > text { fill: #633806; }
    .c-red    > rect { fill: #FCEBEB; stroke: #A32D2D; } .c-red    > text { fill: #791F1F; }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

  <g class="c-teal"><rect x="180" y="60" width="160" height="44" rx="8" stroke-width="0.5"/><text class="th" x="260" y="82" text-anchor="middle" dominant-baseline="central">DRAFT</text></g>
  <g class="c-teal"><rect x="180" y="134" width="160" height="44" rx="8" stroke-width="0.5"/><text class="th" x="260" y="156" text-anchor="middle" dominant-baseline="central">LOCKED</text></g>
  <g class="c-teal"><rect x="180" y="208" width="160" height="44" rx="8" stroke-width="0.5"/><text class="th" x="260" y="230" text-anchor="middle" dominant-baseline="central">APPROVED</text></g>
  <g class="c-teal"><rect x="180" y="282" width="160" height="44" rx="8" stroke-width="0.5"/><text class="th" x="260" y="304" text-anchor="middle" dominant-baseline="central">PENDING_CHECK</text></g>

  <line x1="260" y1="109" x2="260" y2="124" class="arr" marker-end="url(#a)"/>
  <text class="ts" x="172" y="120" text-anchor="end">First confirmation</text>
  <line x1="260" y1="183" x2="260" y2="198" class="arr" marker-end="url(#a)"/>
  <text class="ts" x="172" y="194" text-anchor="end">Second confirmation</text>
  <line x1="260" y1="257" x2="260" y2="272" class="arr" marker-end="url(#a)"/>
  <text class="ts" x="172" y="268" text-anchor="end">Create delivery job</text>

  <g class="c-gray"><rect x="470" y="134" width="150" height="44" rx="8" stroke-width="0.5"/><text class="th" x="545" y="156" text-anchor="middle" dominant-baseline="central">INVALIDATED</text></g>
  <g class="c-gray"><rect x="470" y="208" width="150" height="44" rx="8" stroke-width="0.5"/><text class="th" x="545" y="230" text-anchor="middle" dominant-baseline="central">REVOKED</text></g>

  <path d="M340 82 L400 82 L400 152 L460 152" class="arr" marker-end="url(#a)"/>
  <text class="ts" x="406" y="74">Revised or discarded</text>
  <line x1="340" y1="164" x2="460" y2="164" class="arr" marker-end="url(#a)"/>
  <line x1="340" y1="230" x2="460" y2="230" class="arr" marker-end="url(#a)"/>
  <text class="ts" x="400" y="222" text-anchor="middle">Revoked</text>

  <path d="M260 331 L260 350 L102 350 L102 365" class="arr" marker-end="url(#a)"/>
  <path d="M260 331 L260 350 L246 350 L246 365" class="arr" marker-end="url(#a)"/>
  <path d="M260 331 L260 350 L390 350 L390 365" class="arr" marker-end="url(#a)"/>
  <path d="M260 331 L260 350 L534 350 L534 365" class="arr" marker-end="url(#a)"/>

  <g class="c-teal"><rect x="40" y="370" width="124" height="60" rx="8" stroke-width="0.5"/>
    <text class="th" x="102" y="390" text-anchor="middle" dominant-baseline="central">DRY_RUN</text>
    <text class="th" x="102" y="408" text-anchor="middle" dominant-baseline="central">_PREPARED</text></g>
  <g class="c-gray"><rect x="184" y="370" width="124" height="60" rx="8" stroke-width="0.5"/>
    <text class="th" x="246" y="390" text-anchor="middle" dominant-baseline="central">OUTCOME</text>
    <text class="th" x="246" y="408" text-anchor="middle" dominant-baseline="central">_UNKNOWN</text></g>
  <g class="c-amber"><rect x="328" y="370" width="124" height="60" rx="8" stroke-width="0.5"/>
    <text class="th" x="390" y="390" text-anchor="middle" dominant-baseline="central">RETRY_WAIT</text>
    <text class="ts" x="390" y="412" text-anchor="middle" dominant-baseline="central">Max 5 attempts</text></g>
  <g class="c-red"><rect x="472" y="370" width="124" height="60" rx="8" stroke-width="0.5"/>
    <text class="th" x="534" y="390" text-anchor="middle" dominant-baseline="central">PAUSED</text>
    <text class="ts" x="534" y="412" text-anchor="middle" dominant-baseline="central">Reason logged</text></g>

  <line x1="452" y1="400" x2="466" y2="400" class="arr" marker-end="url(#a)"/>
  <path d="M596 400 L616 400 L616 300 L350 300" class="arr" marker-end="url(#a)"/>
  <text class="ts" x="480" y="292" text-anchor="middle">Manual resume (five reason codes only)</text>

  <g class="c-gray"><rect x="40" y="466" width="600" height="98" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="488" text-anchor="middle" dominant-baseline="central">The reason code decides whether PAUSED can resume</text>
    <text class="ts" x="340" y="512" text-anchor="middle" dominant-baseline="central">Resumable: ADVISER_UNAVAILABLE · ADVICE_INVALID · ADVICE_PAUSED</text>
    <text class="ts" x="340" y="530" text-anchor="middle" dominant-baseline="central">RECIPIENT_DISABLED · ACTOR_DISABLED</text>
    <text class="ts" x="340" y="548" text-anchor="middle" dominant-baseline="central">Not resumable: RETRY_EXHAUSTED · DELIVERY_WINDOW_CLOSED</text></g>
</svg>
