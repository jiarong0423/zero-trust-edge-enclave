<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SOC Audit Dashboard - Zero-Trust Edge Enclave</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow" data-i18n="Security Operations">Security Operations</p>
        <h1 data-i18n="SOC Audit Dashboard">SOC Audit Dashboard</h1>
      </div>
      <nav aria-label="Primary navigation" data-i18n-aria-label="Primary navigation">
        <a class="nav-link" href="/" data-i18n="Sender Enclave">Sender Enclave</a>
        <a class="nav-link" href="/decode.html" data-i18n="Recipient Decode Gate">Recipient Decode Gate</a>
        <a class="nav-link active" href="/audit.html" data-i18n="SOC Audit Dashboard">SOC Audit Dashboard</a>
      </nav>
    </header>

    <main class="layout dashboard-layout">
      <section class="panel metric-panel">
        <p class="eyebrow" data-i18n="Runtime">Runtime</p>
        <h2 id="runtimeMode" data-i18n="Checking">Checking</h2>
      </section>
      <section class="panel metric-panel">
        <p class="eyebrow" data-i18n="Allowed">Allowed</p>
        <h2 id="allowCount">0</h2>
      </section>
      <section class="panel metric-panel">
        <p class="eyebrow" data-i18n="Denied">Denied</p>
        <h2 id="denyCount">0</h2>
      </section>

      <section class="panel wide">
        <div class="section-heading">
          <p class="eyebrow" data-i18n="Audit Events">Audit Events</p>
          <h2 data-i18n="Access Events">Access Events</h2>
        </div>
        <div class="button-row">
          <button id="refreshBtn" class="button primary" data-i18n="Refresh audit">Refresh audit</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th data-i18n="Time">Time</th>
                <th data-i18n="Result">Result</th>
                <th data-i18n="Type">Type</th>
                <th data-i18n="Snapshot version">Snapshot version</th>
                <th data-i18n="Attempts">Attempts</th>
                <th data-i18n="Task code">Task code</th>
                <th data-i18n="Reason">Reason</th>
              </tr>
            </thead>
            <tbody id="auditRows">
              <tr>
                <td colspan="7" data-i18n="No audit events loaded.">No audit events loaded.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="/audit.js" type="module"></script>
  </body>
</html>
