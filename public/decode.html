<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recipient Decode Gate - Zero-Trust Edge Enclave</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow" data-i18n="Recipient Runtime">Recipient Runtime</p>
        <h1 data-i18n="Recipient Decode Gate">Recipient Decode Gate</h1>
      </div>
      <nav aria-label="Primary navigation" data-i18n-aria-label="Primary navigation">
        <a class="nav-link" href="/" data-i18n="Sender Enclave">Sender Enclave</a>
        <a class="nav-link active" href="/decode.html" data-i18n="Recipient Decode Gate">Recipient Decode Gate</a>
        <a class="nav-link" href="/audit.html" data-i18n="SOC Audit Dashboard">SOC Audit Dashboard</a>
      </nav>
    </header>

    <main class="layout two-column">
      <section class="panel">
        <div class="section-heading">
          <p class="eyebrow" data-i18n="Access Claim">Access Claim</p>
          <h2 data-i18n="Authorized recipient access">Authorized recipient access</h2>
        </div>

        <label class="field">
          <span data-i18n="Task code">Task code</span>
          <input id="packageId" placeholder="Paste or open a sealed link" data-i18n-placeholder="Paste or open a sealed link">
        </label>

        <label class="field">
          <span data-i18n="Snapshot version">Snapshot version</span>
          <input id="snapshotVersion" type="number" min="1" step="1" value="1">
        </label>

        <button id="decodeBtn" class="button primary" data-i18n="Download original file">Download original file</button>
      </section>

      <section class="panel">
        <div class="section-heading">
          <p class="eyebrow" data-i18n="Protected View">Protected View</p>
          <h2 data-i18n="Local browser memory render">Local browser memory render</h2>
        </div>
        <div id="decodeStatus" class="status-card" data-i18n="No decode attempt yet.">No decode attempt yet.</div>
        <button id="acknowledgeFile" class="button" disabled data-i18n="Confirm complete receipt">Confirm complete receipt</button>
        <button id="retryReceipt" class="button" disabled data-i18n="Retry receipt report">Retry receipt report</button>
        <button id="refreshReceipt" class="button" data-i18n="Refresh receipt status">Refresh receipt status</button>
      </section>
    </main>

    <script src="/decode.js" type="module"></script>
  </body>
</html>
