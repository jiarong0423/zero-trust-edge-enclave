name: tests

# The project has no third-party packages, so there is nothing to install: check out, set up Node, run the suite.
# Two Node lines: the lowest the project supports (engines >= 20.11) and a current one.
on:
  push:
    branches: [main, ci-trial]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['20.x', '22.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: npm run check
      - name: Full suite
        run: npm run test:all
